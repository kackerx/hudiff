<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- hudiff mark: gray HUD corners (unchanged context) framing a diff: red removed line, green added line -->
  <style>
    .hud{stroke:#8b949e} .del{stroke:#cf222e} .add{stroke:#2da44e}
    @media (prefers-color-scheme:dark){ .hud{stroke:#6e7681} .del{stroke:#f85149} .add{stroke:#3fb950} }
  </style>
  <g fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path class="hud" d="M9 21V9h12M43 9h12v12M9 43v12h12M55 43v12H43"/>
    <path class="del" d="M22 26h15"/>
    <path class="add" d="M22 38h20"/>
  </g>
</svg>
